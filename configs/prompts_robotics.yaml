model: cosmos-video
endpoint: /v1/video/generations
defaults:
  duration_seconds: 4
  fps: 16
  width: 512
  height: 512
  seed: 42
prompts:
  - id: robot_arm_pick_cube
    prompt: "A robot arm picks up a red cube from a table and places it into a blue tray. Static camera, clean industrial lab, realistic physics."
  - id: warehouse_mobile_robot
    prompt: "A mobile robot drives through a warehouse aisle while avoiding a walking human. Static surveillance-style camera, realistic motion."
  - id: humanoid_reach_tool
    prompt: "A humanoid robot reaches toward a tool on a workbench without dropping nearby objects. Realistic indoor lab scene."

